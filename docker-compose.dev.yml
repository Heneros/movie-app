version: '3.8'

services:
 postgres_master:
   restart: always
   container_name: postgres_master
   env_file: ./.env
   build:
     context: ./docker/dev/postgresql_master
   environment: 
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    PGDATA: /var/lib/postgresql/data
   volumes:
   - master_data:/var/lib/postgresql/data
  #  - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
  #  - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
   ports:
     - "5432:5432"  
   command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
   networks:
    app_movie:

 pg_slave:
    image: postgres:13.5
    container_name: pg_slave
    restart: always
    env_file: ./.env
    build:
     context: ./docker/dev/postgresql_slave
    environment: 
     POSTGRES_USER: ${POSTGRES_USER}
     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
     POSTGRES_DB: ${POSTGRES_DB}
     PGDATA: /var/lib/postgresql/data
    # command: >
    #   bash -c "
    #     until pg_isready -h postgres_master -U ${POSTGRES_USER}; do
    #       echo 'Waiting for master...';
    #       sleep 2;
    #     done;
    #     rm -rf /var/lib/postgresql/data/* &&
    #     pg_basebackup -h postgres_master -D /var/lib/postgresql/data -U ${POSTGRES_USER} -Fp -Xs -P -R &&
    #     echo \"primary_conninfo = 'host=postgres_master port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}'\" >> /var/lib/postgresql/data/postgresql.auto.conf &&
    #     chmod 700 /var/lib/postgresql/data &&
    #     postgres
    #   "
    # volumes: 
    #   - slave_data:/var/lib/postgresql/data

    depends_on:
      - postgres_master
    networks:
      app_movie:

     
 pgadmin:
   container_name: pgadmi_nest
   image: dpage/pgadmin4:8
   restart: always
   environment: 
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
   ports: 
     - "5050:80"
   depends_on:  
    - postgres_master
   volumes:
      - pgadmin-data:/var/lib/pgadmin
   networks:
    app_movie:

 mongodb:
   image: mongo:7.0.16
   restart: always
   ports:
     - "27017:27017"
   environment:
       - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
       - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
   volumes:
     - mongodb-data:/data/db
   networks:
      app_movie:

  
 mongo-express:
    image: mongo-express:1-18-alpine3.19
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
    - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME}
    - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD}
    - ME_CONFIG_MONGODB_URL=${MONGO_URL}
 
 maildev:
  image: maildev/maildev:2.2.1
  restart: always
  ports:
    - "1080:1080"
    - "1025:1025"
  environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
  networks:
    app_movie:

 redis:
  image: redis:7.4
  container_name: 'redis-nestjs'
  restart: always
  ports:
   - '6379:6379'
  volumes:
  - redis_data:/data
  networks:
    app_movie:

volumes:
  master_data:
  redis_data:
  pgadmin-data:
  slave_data:
  mongodb-data:

networks:
  app_movie:
    driver: bridge
