 maildev:
  image: maildev/maildev:2.2.1
  restart: always
  ports:
    - "1080:1080"
    - "1025:1025"
  environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
  networks:
    app_movie:

 redis:
  image: redis:7.4
  container_name: 'redis-nestjs'
  restart: always
  ports:
   - '6379:6379'
  volumes:
  - redis_data:/data
  networks:
    app_movie:

volumes:
  redis_data:
  pgadmin-data:
  movies_db_data:
  mongodb-data:
  slave_data:

networks:
  app_movie:
    driver: bridge