 pgadmin:
   container_name: pgadmi_nest
   image: dpage/pgadmin4:8
   restart: always
   environment: 
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
   ports: 
     - "5050:80"
   depends_on:  
    - postgres_master
   volumes:
      - pgadmin-data:/var/lib/pgadmin
   networks:
    app_movie:

