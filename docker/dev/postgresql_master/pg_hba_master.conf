# PostgreSQL Client Authentication Configuration File
# ===================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     trust
# IPv4 local connections:
host    all             all             127.0.0.1/32            trust
# IPv6 local connections:
host    all             all             ::1/128                 trust
host    all             all            all                       md5
host    all             all            0.0.0.0/0                 md5

# Allow replication connections
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     all             0.0.0.0/0               trust
host    all             all             0.0.0.0/0               trust
host    replication     postgres        172.18.0.0/16           trust
host    replication     ${POSTGRES_USER}    0.0.0.0/0               trust
host    replication     postgres    172.18.0.7/32    md5
host    replication     postgres    172.18.0.6/32    trust

host    replication     postgres    172.18.0.6/32    md5
host    replication     postgres        postgres_slave/32        md5
