name: MovieApp.Nest.js
on: 
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    basic:
        runs-on: ubuntu-latest
        services:
            postgres:
              image: postgres:14-alpine
              env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: moviedb
              options: >-
                   --health-cmd pg_isready
                   --health-interval 10s
                   --health-timeout 5s
                   --health-retries 5
              ports:
                - 5432:5432
            redis:
               image: redis:7.4-alpine
               ports:
                - 6379:6379
               options: >-
                --health-cmd "redis-cli ping"
                --health-interval 10s
                --health-timeout 5s
                --health-retries 5
                
            maildev:
              image: maildev/maildev
              ports:
               - 1080:1080 
               - 1025:1025 
              options: >-
                --health-cmd "wget --quiet --tries=1 --spider http://localhost:1080 || exit 1"
                --health-interval 10s
                --health-timeout 5s
                --health-retries 5

        env:
    
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/moviedb"
          
        
          NODE_ENV: test
   
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          
     
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_SECRET: testjwtaccess
          JWT_REFRESH_SECRET: testjwtrefresh
          SECRET_SESSION: testjwtsession
          
        
          PAGINATION: 5
          
  
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          
      
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_SECRET }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20.12.2
                cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: verify project structure
              run: |
                 echo "Checking project structure..."
                 ls -la src/auth/repositories/ || echo "Auth repositories directory not found"
                 cat tsconfig.json

            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y redis-tools postgresql-client curl wget

            - name: Wait for services to be ready
              run: |
                echo "Waiting for PostgreSQL..."
                timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do echo "Waiting for postgres..."; sleep 2; done'
                
                echo "Waiting for Redis..."
                timeout 60 bash -c 'until redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG; do echo "Waiting for redis..."; sleep 2; done'
                
                echo "Waiting for MailDev..."
                timeout 60 bash -c 'until curl -f http://localhost:1080 > /dev/null 2>&1; do echo "Waiting for maildev..."; sleep 2; done'
                
                echo "All services are ready!"

            - name: Setup database
              run: |
                echo "Setting up database..."
                npx prisma generate
                npx prisma migrate reset --force --skip-seed
                npx prisma migrate deploy

            - name: Build application
              run: npm run build

            - name: Run linting
              run: npm run lint

            - name: Run e2e tests
              env:
                NODE_OPTIONS: "--max-old-space-size=4096 --unhandled-rejections=strict"
              run: |
                echo "Starting e2e tests..."
                npm run test:e2e -- --verbose --detectOpenHandles --forceExit

            - name: Cleanup
              if: always()
              run: |
                echo "Cleaning up..."
                redis-cli -h 127.0.0.1 -p 6379 flushall || true
                
            - name: Job summary
              if: always()
              run: |
                echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
                echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."