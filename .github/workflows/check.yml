name: MovieApp.Nest.js
on: 
    push:
        branches: [master]
    pull_request:
        branches: [master]



jobs:

    basic:
        runs-on: ubuntu-latest
        services:
            postgres:
              image: postgres:17.4
              env:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: moviedb
              options: >-
                   --health-cmd pg_isready
                   --health-interval 10s
                   --health-timeout 5s
                   --health-retries 5
              ports:
                - 5432:5432
        steps:
            # Downloads a copy of the code in your repository before running CI tests
            - name: Checkout
              uses: actions/checkout@v3  

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20.12.2

            - name: Install dependencies
              run: npm ci
            
            - name:  Wait for PostgreSQL to be ready
              run: |
               echo "Waiting for PostgreSQL to start..."
            for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres -d moviedb; then
              echo "PostgreSQL is ready!"
              break
            else
              echo "PostgreSQL is not ready yet. Retrying in 5 seconds..."
              sleep 5
            fi
            done

            - name: run migrations
              env: 
                DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/moviedb"
              run: npx prisma migrate deploy

            - name: Lint
              run: npm run lint

            - name: Run Tests
              env: DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/moviedb"
              run: npm run test:e2e

            - run:  echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
            - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
              
            