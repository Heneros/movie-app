version: '3.8'

services:
 
 postgres:
   image: postgres:13.5
   restart: always
   env_file: ./.env
   environment: 
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
   volumes:
   - postgres:/var/lib/postgresql/data
   ports:
     - "5432:5432"  
   healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
   networks:
    app_movie:

 pgadmin:
   container_name: pgadmi_nest
   image: dpage/pgadmin4:latest
   environment: 
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
   ports: 
     - "5050:80"
   depends_on:  
    - postgres
   restart: always
   networks:
    app_movie:

   
 maildev:
  image: maildev/maildev:2.2.1
  restart: always
  ports:
    - "1080:1080"
    - "1025:1025"
  environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
  networks:
    app_movie:

    
 redis:
  image: redis:7.4
  container_name: 'redis-nestjs'
  restart: always
  ports:
   - '6379:6379'
  volumes:
  - redis_data:/data
  networks:
    app_movie:

 nestapp:
  container_name: 'nestapp'
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
  environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/moviedb?schema=public
  ports:
   - '3000:3000'
  build:
    context: .
    dockerfile: ./docker/dev/nestjs/Dockerfile
  volumes:
   - .:/app
   - /app/node_modules
  networks:
    app_movie:


volumes:
  postgres:
  redis_data:

networks:
  app_movie:
   driver: bridge
