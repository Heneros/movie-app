#     - ME_CONFIG_MONGODB_URL=${MONGO_URL}
 
 maildev:
  image: maildev/maildev:2.2.1
  restart: always
  ports:
    - "1080:1080"
    - "1025:1025"
  environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
  networks:
    app_movie:

 redis:
  image: redis:7.4
  container_name: 'redis-nestjs'
  restart: always
  ports:
   - '6379:6379'
  volumes:
  - redis_data:/data
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5
  networks:
    app_movie:

 redisinsight:
    container_name: re-insig
    image: redislabs/redisinsight:latest
    ports:
      - "8001:8001"
    depends_on:
      - redis
    volumes:
      - ./data/redisinsight:/db
    restart: always

 nestapp:
    container_name: nestapp
    build:
        context: .
        dockerfile: ./docker/dev/nestjs/Dockerfile
    restart: always
    command: npm run start:dev
    depends_on:
        postgres:
          condition: service_healthy 
        redis:
          condition: service_healthy 
    env_file: ./.env
    ports:
     - "3000:3000"
    #  - "9229:9229" 
    environment:
      # - DEBUG=* 
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    volumes:
        - .:/usr/src/app
        - /usr/src/app/node_modules
    command: >
      sh -c "
        echo 'running migrations…' &&
        npx prisma migrate deploy &&       
        echo 'seeding DB…' &&
        npx prisma db seed &&
        echo 'starting dev server…' &&
        npm run start:dev
      "
    networks:
      app_movie:   

 nginx:
   container_name: nginx_nest
   restart: always
   build:
    context: .
    dockerfile: ./docker/dev/nginx/Dockerfile
   volumes:
    - ./logs/nginx:/var/log/nginx
   ports:
      - "80:80"
      - "443:443"
   depends_on:
      - nestapp
   networks:
    app_movie:   


volumes:
  redis_data:
  pgadmin-data:
  movies_db_data:
  mongodb-data:
  slave_data:

networks:
  app_movie:
    driver: bridge
