 maildev:
  image: maildev/maildev:2.2.1
  restart: always
  ports:
    - "1080:1080"
    - "1025:1025"
  environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
  networks:
    app_movie:

 redis:
  image: redis:7.4
  restart: always
  ports:
   - '6379:6379'
  volumes:
  - redis_data:/data
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 5
  networks:
    app_movie:




 nestjs:
    build:
        context: .
        dockerfile: ./docker/prod/nestjs/Dockerfile
        target: production  
    restart: always
    depends_on:
         postgres:
          condition: service_healthy
         redis:
          condition: service_healthy 
    env_file: ./.env.prod
    # environment:
    #   REDIS_HOST: nest-projectfour-redis
    #   REDIS_PORT: 6379
    #  - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-master:5432/${POSTGRES_DB}?schema=public
    ports:
     - 3000:3000
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '0.5'
    #     reservations:
    #       memory: 256M
    #       cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - /app/node_modules
    networks:
      app_movie:   

 nginx:
   container_name: nginx_nest
   restart: always
   build:
    context: .
    dockerfile: ./docker/prod/nginx/Dockerfile
   volumes:
    - ./logs/nginx:/var/log/nginx
   ports:
      - "80:80"
      - "443:443"
   depends_on:
      - nestjs
   networks:
    app_movie:   


volumes:
  redis_data:
  pgadmin-data:
  movies_db_data:
  mongodb-data:
  nestjs:
  slave_data:

networks:
  app_movie:
    driver: bridge
